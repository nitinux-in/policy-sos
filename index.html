<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Light is the default. Apply a saved dark preference before first paint to avoid a flash.
      try {
        if (localStorage.getItem('dic-theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark';
          document.querySelector('meta[name="theme-color"]').content = '#161a1f';
        }
      } catch (e) {}
    </script>
    <meta name="description" content="Ask about your health and term life policies and get answers backed by the policy wording." />
    <title>Ditto</title>
    <link rel="icon" type="image/png" href="/brand/favicon.png" />
    <link rel="preload" href="/fonts/Inter-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Inter-SemiBold.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
